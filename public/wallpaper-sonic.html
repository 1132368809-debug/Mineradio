<!doctype html>
<html lang="zh-CN">
<head>

  <title>Mineradio Sonic Wallpaper</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    #cover-bg{position:fixed;inset:-7%;background-size:cover;background-position:center;opacity:0;filter:blur(92px) brightness(.32) saturate(1.28);transform:scale(1.13);transition:opacity .45s ease,background-image .45s ease;pointer-events:none}
    #cover-bg::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 48% 42%,rgba(255,255,255,.16),rgba(0,0,0,.18) 34%,rgba(0,0,0,.72) 76%)}
    canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  </style>
</head>
<body>
  <div id="cover-bg"></div>
  <canvas id="stage"></canvas>
  <script src="vendor/three.r128.min.js"></script>
  <script>
  'use strict';

  var canvas = document.getElementById('stage');
  var coverBg = document.getElementById('cover-bg');
  var renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    alpha: true,
    antialias: false,
    premultipliedAlpha: false,
    powerPreference: 'high-performance'
  });
  renderer.setClearColor(0x000000, 0);
  renderer.setPixelRatio(Math.min(0.7, window.devicePixelRatio || 1));

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(50, 1, 0.1, 280);
  camera.position.set(-37.58, 25.72, 92.26);
  camera.lookAt(0, 0, 0);

  var ambientLight = new THREE.AmbientLight(0xffffff, 0.50);
  var keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
  keyLight.position.set(10, 20, 10);
  scene.add(ambientLight);
  scene.add(keyLight);

  var visualPlatter = new THREE.Group();
  scene.add(visualPlatter);

  var state = {
    enabled: true,
    playing: false,
    opacity: 0.9,
    texture: '',
    cover: '',
    textureType: '',
    colors: { primary:'#d6f8ff', secondary:'#9cffdf', highlight:'#eef7ff', glow:'#9cffdf' },
    motion: {},
    visual: { intensity:1.08, depth:1.04, speed:0.68, bloomStrength:0.72 }
  };
  var smooth = {
    subBass: 0.08, bass: 0.08, lowMid: 0.06, mid: 0.05,
    highMid: 0.04, presence: 0.04, brilliance: 0.04, air: 0.04,
    kickEnvelope: 0, warmth: 0.42, brightness: 0.34, density: 0.48,
    sharpness: 0.35, smoothness: 0.58, energy: 0.08
  };

  function clamp(v, lo, hi) {
    v = Number(v);
    if (!isFinite(v)) v = lo;
    return Math.max(lo, Math.min(hi, v));
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function smoothstep(a, b, x) {
    x = clamp((x - a) / Math.max(0.00001, b - a), 0, 1);
    return x * x * (3 - 2 * x);
  }
  function hexColor(value, fallback) {
    value = String(value || fallback || '#d6f8ff').trim();
    var rgb = value.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/i);
    if (rgb) return new THREE.Color(Number(rgb[1]) / 255, Number(rgb[2]) / 255, Number(rgb[3]) / 255);
    if (/^#[0-9a-f]{3}$/i.test(value)) value = '#' + value[1] + value[1] + value[2] + value[2] + value[3] + value[3];
    if (!/^#[0-9a-f]{6}$/i.test(value)) value = fallback || '#d6f8ff';
    return new THREE.Color(value);
  }
  function isVideoSource(src, type) {
    return String(type || '').toLowerCase() === 'video' || /\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(String(src || ''));
  }

  function fallbackCoverTexture() {
    var c = document.createElement('canvas');
    c.width = c.height = 512;
    var ctx = c.getContext('2d');
    var g = ctx.createLinearGradient(0, 0, 512, 512);
    g.addColorStop(0, state.colors.primary || '#d6f8ff');
    g.addColorStop(0.54, state.colors.secondary || '#9cffdf');
    g.addColorStop(1, state.colors.highlight || '#eef7ff');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 512, 512);
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < 96; i++) {
      var x = Math.abs(Math.sin(i * 17.1)) * 512;
      var y = Math.abs(Math.sin(i * 41.7)) * 512;
      var r = 16 + Math.abs(Math.sin(i * 9.3)) * 98;
      var rg = ctx.createRadialGradient(x, y, 0, x, y, r);
      rg.addColorStop(0, 'rgba(255,255,255,.12)');
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = rg;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    return tex;
  }

  var coverTexture = fallbackCoverTexture();
  var coverKey = '';
  var loader = new THREE.TextureLoader();
  loader.setCrossOrigin('anonymous');

  var ripples = [];
  for (var ri = 0; ri < 10; ri++) {
    ripples.push({ pos: new THREE.Vector2(), time: -100, strength: 0, isActive: 0, rippleType: 0 });
  }
  var rippleIndex = 0;
  function addRipple(x, z, strength, white) {
    var r = ripples[rippleIndex];
    r.pos.set(x, z);
    r.time = clockTime;
    r.strength = clamp(strength, 0, 3.0);
    r.isActive = 1;
    r.rippleType = white ? 1 : 0;
    rippleIndex = (rippleIndex + 1) % ripples.length;
  }

  var mapMaterial = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: true,
    uniforms: {
      uTime: { value: 0 },
      uSubBass: { value: 0 },
      uBass: { value: 0 },
      uLowMid: { value: 0 },
      uMid: { value: 0 },
      uHighMid: { value: 0 },

      uOpacity: { value: 0.92 }
    },
    vertexShader: [
      'uniform float uTime;',
      'uniform float uSubBass;',
      'uniform float uBass;',
      'uniform float uLowMid;',
      'uniform float uMid;',
      'uniform float uHighMid;',
      'uniform float uSmoothness;',
      'uniform float uDensity;',
      'uniform float uEnergy;',
      'uniform float uAmplitude;',
      'struct Ripple { vec2 pos; float time; float strength; float isActive; float rippleType; };',
      'uniform Ripple uRipples[10];',
      'varying vec2 vUv;',
      'varying float vElevation;',
      'varying float vDistance;',
      'varying vec2 vRippleAnim;',
      'varying vec3 vNormal;',
      'varying float vRelativeY;',
      'varying vec2 vInstancePos;',
      'vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}',
      'vec2 mod289(vec2 x){return x-floor(x*(1.0/289.0))*289.0;}',
      'vec3 permute(vec3 x){return mod289(((x*34.0)+1.0)*x);}',
      'float snoise(vec2 v){const vec4 C=vec4(0.211324865405187,0.366025403784439,-0.577350269189626,0.024390243902439);vec2 i=floor(v+dot(v,C.yy));vec2 x0=v-i+dot(i,C.xx);vec2 i1=(x0.x>x0.y)?vec2(1.0,0.0):vec2(0.0,1.0);vec4 x12=x0.xyxy+C.xxzz;x12.xy-=i1;i=mod289(i);vec3 p=permute(permute(i.y+vec3(0.0,i1.y,1.0))+i.x+vec3(0.0,i1.x,1.0));vec3 m=max(0.5-vec3(dot(x0,x0),dot(x12.xy,x12.xy),dot(x12.zw,x12.zw)),0.0);m=m*m;m=m*m;vec3 x=2.0*fract(p*C.www)-1.0;vec3 h=abs(x)-0.5;vec3 ox=floor(x+0.5);vec3 a0=x-ox;m*=1.79284291400159-0.85373472095314*(a0*a0+h*h);vec3 g;g.x=a0.x*x0.x+h.x*x0.y;g.yz=a0.yz*x12.xz+h.yz*x12.yw;return 130.0*dot(m,g);}',
      'float random(vec2 st){return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);}',
      'void main(){',
      '  vUv=uv;',
      '  vNormal=normal;',
      '  vec4 instancePos=instanceMatrix*vec4(0.0,0.0,0.0,1.0);',
      '  vec2 pos2D=instancePos.xz;',
      '  vInstancePos=pos2D;',
      '  float centerDist=length(pos2D);',
      '  vDistance=centerDist;',
      '  float rnd=random(pos2D);',
      '  vec2 movingPos=pos2D*0.05+vec2(uTime*0.1,uTime*0.05);',
      '  float baseNoise=(snoise(movingPos)+1.0)*0.5;',
      '  float wave=sin(pos2D.x*0.15+pos2D.y*0.1-uTime*0.6)*0.5+0.5;',
      '  float globalFalloff=smoothstep(60.0,30.0,centerDist);',
      '  float idleElevation=mix(baseNoise,wave,uSmoothness*0.5+0.2)*0.8*globalFalloff;',
      '  float subRegion=smoothstep(25.0,0.0,centerDist);',

      '  float bassNoise=snoise(pos2D*0.1-vec2(0.0,uTime*0.2));',
      '  float bassRegion=smoothstep(35.0,5.0,centerDist+bassNoise*5.0);',
      '  float bassLift=uBass*bassRegion*smoothstep(0.0,1.0,rnd+uDensity*0.5)*4.0;',
      '  float lowMidNoise=snoise(pos2D*0.05+vec2(uTime*0.1,0.0));',
      '  float lowMidLift=uLowMid*(lowMidNoise*0.5+0.5)*2.5;',
      '  float riverFlow=sin(pos2D.x*0.2+pos2D.y*0.2+snoise(pos2D*0.1)*2.0-uTime*2.0);',
      '  float midLift=uMid*max(0.0,riverFlow)*3.0;',
      '  float highMidRegion=smoothstep(10.0,45.0,centerDist);',
      '  float highMidLift=0.0;',
      '  if(fract(rnd*13.3)>0.8){highMidLift=uHighMid*highMidRegion*fract(rnd*7.7)*2.5;}',
      '  float audioElevation=subLift+bassLift+lowMidLift+midLift+highMidLift;',
      '  if(rnd>0.99){audioElevation+=uEnergy*5.0;}',
      '  audioElevation*=globalFalloff;',
      '  audioElevation=max(0.0,audioElevation-0.2);',
      '  audioElevation*=uAmplitude;',
      '  float elevation=idleElevation+audioElevation;',
      '  float rippleElevation=0.0;',
      '  float rippleIntensityNormal=0.0;',
      '  float rippleIntensityWhite=0.0;',
      '  for(int i=0;i<10;i++){',
      '    if(uRipples[i].isActive>0.0){',
      '      float dist=length(pos2D-uRipples[i].pos);',
      '      float timeSince=uTime-uRipples[i].time;',
      '      float curSpeed=15.0;',
      '      float curWidth=3.0;',
      '      float curFadeDist=15.0;',
      '      float elevationScale=4.0;',
      '      if(uRipples[i].rippleType>0.5){curSpeed=20.0;curWidth=1.0;curFadeDist=8.0;elevationScale=1.0;}',
      '      float waveRadius=timeSince*curSpeed;',
      '      float d=dist-waveRadius;',
      '      float rippleWave=exp(-d*d/curWidth);',
      '      float fade=exp(-waveRadius/curFadeDist);',
      '      float rPulse=rippleWave*fade*uRipples[i].strength;',
      '      rippleElevation+=rPulse*elevationScale;',
      '      if(uRipples[i].rippleType>0.5){rippleIntensityWhite+=rPulse;}else{rippleIntensityNormal+=rPulse;}',
      '    }',
      '  }',
      '  elevation+=rippleElevation;',
      '  vRippleAnim=vec2(clamp(rippleIntensityNormal,0.0,1.0),clamp(rippleIntensityWhite,0.0,1.0));',
      '  vElevation=elevation;',
      '  float yPos=position.y+0.5;',
      '  vRelativeY=yPos;',
      '  float totalHeight=1.0+elevation;',
      '  vec3 pos=position;',
      '  pos.y=-0.5+yPos*totalHeight;',
      '  vec4 worldPosition=modelMatrix*instanceMatrix*vec4(pos,1.0);',
      '  gl_Position=projectionMatrix*viewMatrix*worldPosition;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'uniform float uTime;',
      'uniform float uPresence;',
      'uniform float uBrilliance;',
      'uniform float uAir;',
      'uniform float uWarmth;',
      'uniform float uBrightness;',
      'uniform float uSharpness;',
      'uniform vec3 uBaseColor1;',
      'uniform vec3 uBaseColor2;',
      'uniform vec3 uFogColor;',
      'uniform vec3 uCoolCore;',
      'uniform vec3 uCoolEdge;',
      'uniform vec3 uWarmCore;',
      'uniform vec3 uWarmEdge;',
      'uniform vec3 uRippleColor;',
      'uniform float uGlowIntensity;',
      'uniform float uOpacity;',
      'varying vec2 vUv;',
      'varying float vElevation;',
      'varying float vDistance;',
      'varying vec2 vRippleAnim;',
      'varying vec3 vNormal;',
      'varying float vRelativeY;',
      'varying vec2 vInstancePos;',
      'float random(vec2 st){return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);}',
      'void main(){',
      '  bool isTop=vNormal.y>0.5;',
      '  float distFromTop=1.0-vRelativeY;',
      '  float rnd=random(vInstancePos);',
      '  float centerDist=length(vInstancePos);',
      '  float normElevation=clamp(vElevation/8.0,0.0,1.0);',
      '  vec3 cBase1=uBaseColor1;',
      '  vec3 cBase2=uBaseColor2;',
      '  vec3 coolCore=uCoolCore;',
      '  vec3 coolEdge=uCoolEdge;',
      '  vec3 warmCore=uWarmCore;',
      '  vec3 warmEdge=uWarmEdge;',
      '  float warmBlend=smoothstep(0.0,1.0,uWarmth*1.5+(0.5-centerDist/80.0));',
      '  vec3 zoneCore=mix(coolCore,warmCore,warmBlend);',
      '  vec3 zoneEdge=mix(coolEdge,warmEdge,warmBlend);',
      '  vec3 targetGlow=mix(zoneCore,zoneEdge,fract(rnd*11.0));',
      '  float distFade=1.0-smoothstep(40.0,75.0,centerDist);',
      '  vec3 brightCool=mix(coolCore,vec3(1.0),0.24);',
      '  targetGlow=mix(targetGlow,brightCool,uBrightness*0.6);',
      '  vec3 currentGlow=mix(cBase2,targetGlow,normElevation)*uGlowIntensity*distFade;',
      '  currentGlow=mix(currentGlow,uRippleColor,vRippleAnim.x);',
      '  currentGlow=mix(currentGlow,vec3(1.0),vRippleAnim.y);',
      '  vec3 bodyColor=mix(cBase1,cBase2,vRelativeY*distFade);',
      '  vec3 finalColor;',
      '  if(isTop){',
      '    float topIntensity=smoothstep(0.0,0.4,normElevation);',
      '    float twinkleDistFalloff=smoothstep(60.0,30.0,centerDist);',
      '    float twinkleMultiplier=mix(twinkleDistFalloff,1.0,smoothstep(0.01,0.1,normElevation));',
      '    bool isSparkleTarget=fract(rnd*31.0)>0.95;',
      '    if(isSparkleTarget&&normElevation<0.1){topIntensity+=uAir*2.0*twinkleMultiplier;}',
      '    finalColor=mix(cBase2,currentGlow,topIntensity);',
      '    float edgeX=smoothstep(0.05,0.01,vUv.x)+smoothstep(0.95,0.99,vUv.x);',
      '    float edgeY=smoothstep(0.05,0.01,vUv.y)+smoothstep(0.95,0.99,vUv.y);',
      '    float edge=min(edgeX+edgeY,1.0);',
      '    finalColor+=currentGlow*edge*0.8*(topIntensity+0.3);',
      '    float flashChance=smoothstep(0.3,1.0,uPresence);',
      '    if(fract(rnd*53.0)>0.98-flashChance*0.1){',
      '      float flashSync=sin(uTime*40.0+rnd*100.0)*0.5+0.5;',
      '      finalColor+=mix(vec3(1.0),vec3(0.5,1.0,1.0),rnd)*flashSync*uPresence*(1.0+uSharpness*2.0)*twinkleMultiplier;',
      '    }',
      '    if(edge>0.5&&fract(rnd*89.0+uTime*2.0)>0.98){finalColor+=vec3(1.0)*uBrilliance*3.0*twinkleMultiplier;}',
      '  }else{',
      '    float verticalFalloff=mix(1.0,3.0,uSharpness);',
      '    float sideGlow=smoothstep(0.5/verticalFalloff,0.0,distFromTop)*normElevation;',
      '    if(normElevation<0.02)sideGlow=0.0;',
      '    finalColor=mix(bodyColor,currentGlow,sideGlow*1.5);',
      '    float rimGlow=smoothstep(0.03,0.0,distFromTop)*normElevation;',
      '    finalColor+=currentGlow*rimGlow;',
      '  }',
      '  finalColor+=uRippleColor*vRippleAnim.x*0.6;',
      '  finalColor+=vec3(1.0)*vRippleAnim.y*1.2;',
      '  float aerialFog=smoothstep(30.0,65.0,vDistance);',
      '  vec3 atmosphericColor=mix(cBase1,cBase2,0.4);',
      '  finalColor=mix(finalColor,atmosphericColor,aerialFog*0.35);',
      '  float alphaFade=1.0-smoothstep(55.0,78.0,vDistance);',
      '  float alphaBlend=1.0-alphaFade;',
      '  finalColor=mix(finalColor,uFogColor,alphaBlend*0.45);',
      '  gl_FragColor=vec4(finalColor,alphaFade*uOpacity);',
      '}'
    ].join('\n')
  });

    depthWrite: false,

      uWarmCore: mapMaterial.uniforms.uWarmCore,
      uWarmEdge: mapMaterial.uniforms.uWarmEdge,

    },
    vertexShader: [
      'uniform float uPulse;',
      'varying vec2 vUv;',
      'varying float vElevation;',
      'varying float vDistance;',
      'varying vec2 vRippleAnim;',
      'varying vec3 vNormal;',
      'varying float vRelativeY;',
      'varying vec2 vInstancePos;',
      'void main(){',
      '  vUv=uv;vNormal=normal;',
      '  vec4 instancePos=instanceMatrix*vec4(0.0,0.0,0.0,1.0);',
      '  vec2 pos2D=instancePos.xz;',
      '  vInstancePos=pos2D;vDistance=length(pos2D);',

      '  vec4 worldPosition=modelMatrix*instanceMatrix*vec4(position,1.0);',
      '  gl_Position=projectionMatrix*viewMatrix*worldPosition;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'precision highp float;',
      'uniform float uTime,uPulse,uPresence,uBrilliance,uAir,uWarmth,uBrightness,uSharpness,uGlowIntensity,uOpacity;',
      'uniform vec3 uBaseColor1,uBaseColor2,uFogColor,uCoolCore,uCoolEdge,uWarmCore,uWarmEdge,uRippleColor;',
      'varying vec2 vUv;varying float vElevation;varying float vDistance;varying vec2 vRippleAnim;varying vec3 vNormal;varying float vRelativeY;varying vec2 vInstancePos;',
      'float random(vec2 st){return fract(sin(dot(st.xy,vec2(12.9898,78.233)))*43758.5453123);}',
      'void main(){',
      '  float rnd=random(vInstancePos);float centerDist=length(vInstancePos);float normElevation=clamp(vElevation/8.0,0.0,1.0);',
      '  vec3 cBase1=uBaseColor1;vec3 cBase2=uBaseColor2;vec3 coolCore=uCoolCore;vec3 coolEdge=uCoolEdge;vec3 warmCore=uWarmCore;vec3 warmEdge=uWarmEdge;',
      '  float warmBlend=smoothstep(0.0,1.0,uWarmth*1.5+(0.5-centerDist/80.0));',
      '  vec3 targetGlow=mix(mix(coolCore,warmCore,warmBlend),mix(coolEdge,warmEdge,warmBlend),fract(rnd*11.0));',
      '  targetGlow=mix(targetGlow,mix(coolCore,vec3(1.0),0.24),uBrightness*0.6);',
      '  float distFade=1.0-smoothstep(40.0,75.0,centerDist);',
      '  vec3 currentGlow=mix(cBase2,targetGlow,normElevation)*uGlowIntensity*distFade;',
      '  currentGlow=mix(currentGlow,uRippleColor,vRippleAnim.x);currentGlow=mix(currentGlow,vec3(1.0),vRippleAnim.y);',
      '  float topIntensity=smoothstep(0.0,0.4,normElevation);',
      '  vec3 finalColor=mix(cBase2,currentGlow,topIntensity);',
      '  float edge=min(smoothstep(0.05,0.01,vUv.x)+smoothstep(0.95,0.99,vUv.x)+smoothstep(0.05,0.01,vUv.y)+smoothstep(0.95,0.99,vUv.y),1.0);',

          dummyMatrix.compose(dummyPosition, dummyRotation, dummyScale);
          meteorMesh.setMatrixAt(i, dummyMatrix);
          if (Math.random() > 0.3) spawnParticle(m.x, m.y, m.z, m.speed * 0.2);
        }
      }
    }
    meteorMesh.instanceMatrix.needsUpdate = true;

    for (var j = 0; j < maxParticles; j++) {
      var p = particles[j];
      if (!p.active) {
        hideInstance(particleMesh, j);
      } else {
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          hideInstance(particleMesh, j);
        } else {
          p.x += p.vx * dt * 10;
          p.y += p.vy * dt * 10;
          p.z += p.vz * dt * 10;
          var s = p.scale * (1 - p.life / p.maxLife);
          dummyPosition.set(p.x, p.y, p.z);
          dummyScale.set(s, s, s);
          dummyMatrix.compose(dummyPosition, dummyRotation, dummyScale);
          particleMesh.setMatrixAt(j, dummyMatrix);
        }
      }
    }
    particleMesh.instanceMatrix.needsUpdate = true;
  }

  function animate(now) {
    var targetMs = state.playing ? 50 : 80;
    if (lastRender && now - lastRender < targetMs) {
      requestAnimationFrame(animate);
      return;
    }
    lastRender = now;
    var dt = Math.min(0.08, Math.max(0.001, (now - last) / 1000));
    last = now;
    var visual = state.visual || {};
    var speed = clamp(visual.speed == null ? 0.68 : visual.speed, 0.15, 2.2);
    clockTime += dt * speed;
    updateAudio(dt);
    var opacity = clamp(state.opacity == null ? 0.9 : state.opacity, 0.12, 1);
    setMaterialUniforms(clockTime, opacity);
    platterRotation += 0.15 * dt + smooth.mid * 0.018 * dt;
    visualPlatter.rotation.y = platterRotation;
    updateFloatingBlocks(clockTime, dt);
    updateMeteors(dt);
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  applyTheme();
  setCover('', '');
  for (var ii = 0; ii < maxMeteors; ii++) hideInstance(meteorMesh, ii);
  for (var jj = 0; jj < maxParticles; jj++) hideInstance(particleMesh, jj);
  meteorMesh.instanceMatrix.needsUpdate = true;
  particleMesh.instanceMatrix.needsUpdate = true;

  window.addEventListener('resize', resize);
  if (window.desktopOverlay && window.desktopOverlay.onWallpaperState) {
    window.desktopOverlay.onWallpaperState(applyState);
  }
  resize();
  requestAnimationFrame(animate);
  </script>
</body>
